name: erp-sync-hub

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ERPSYNC_POSTGRES_DB:-erpsynchub}
      POSTGRES_USER: ${ERPSYNC_POSTGRES_USER:-erpsynchub}
      POSTGRES_PASSWORD: ${ERPSYNC_POSTGRES_PASSWORD:?Define ERPSYNC_POSTGRES_PASSWORD (ver docs/variables-de-entorno.md)}
    ports:
      - "127.0.0.1:${ERPSYNC_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  sap-mock:
    build:
      context: .
      dockerfile: src/SapB1.Mock/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ERPSYNC_SAP_MOCK_HOST_PORT:-5201}:8080"

  # --- Seq: visor de logs estructurados (http://localhost:${ERPSYNC_SEQ_HOST_PORT:-5202}). SOLO DESARROLLO LOCAL. ---
  # SEQ_FIRSTRUN_NOAUTHENTICATION desactiva el inicio de sesión para no manejar una contraseña de administrador
  # en el entorno de desarrollo; nunca se debe usar en un Seq accesible desde fuera de esta máquina.
  seq:
    image: datalust/seq:2025.2
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:${ERPSYNC_SEQ_HOST_PORT:-5202}:80"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/api || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # --- El hub: API de webhooks y worker. Se configura solo con variables de entorno. ---
  # Necesita como mínimo ERPSYNC_POSTGRES_PASSWORD y ERPSYNC_WC_WEBHOOK_SECRET en el entorno (ver docs/variables-de-entorno.md).
  hub:
    build:
      context: .
      dockerfile: src/ErpSyncHub.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sap-mock:
        condition: service_healthy
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${ERPSYNC_POSTGRES_DB:-erpsynchub};Username=${ERPSYNC_POSTGRES_USER:-erpsynchub};Password=${ERPSYNC_POSTGRES_PASSWORD:?Define ERPSYNC_POSTGRES_PASSWORD (ver docs/variables-de-entorno.md)}
      Database__MigrateOnStartup: "true"
      Webhooks__WooCommerce__Secret: ${ERPSYNC_WC_WEBHOOK_SECRET:?Define ERPSYNC_WC_WEBHOOK_SECRET (ver docs/variables-de-entorno.md)}
      SAP__BaseUrl: http://sap-mock:8080
      SAP__CompanyDb: ${ERPSYNC_SAP_COMPANY_DB:-SBODemoCL}
      SAP__UserName: ${ERPSYNC_SAP_USER_NAME:-manager}
      SAP__Password: ${ERPSYNC_SAP_PASSWORD:-manager}
      Seq__ServerUrl: http://seq:80
      # La tienda solo se configura si hay credenciales: sin ellas el hub arranca y la sincronización de stock queda desactivada.
      Store__WooCommerce__BaseUrl: ${ERPSYNC_WC_BASE_URL:-${ERPSYNC_WC_CONSUMER_KEY:+http://tienda}}
      Store__WooCommerce__ConsumerKey: ${ERPSYNC_WC_CONSUMER_KEY:-}
      Store__WooCommerce__ConsumerSecret: ${ERPSYNC_WC_CONSUMER_SECRET:-}
      Sync__Inventory__Interval: ${ERPSYNC_INVENTORY_INTERVAL:-00:15:00}
      Sync__Inventory__Warehouses: ${ERPSYNC_INVENTORY_WAREHOUSES:-01}
      Sync__Inventory__PriceList: ${ERPSYNC_INVENTORY_PRICE_LIST:-1}
      Sync__Inventory__PriceDecimals: ${ERPSYNC_INVENTORY_PRICE_DECIMALS:-0}
      Sync__Inventory__FullInterval: ${ERPSYNC_INVENTORY_FULL_INTERVAL:-1.00:00:00}
      # Reintentos de los jobs que fallan por errores transitorios (espera que se duplica, con jitter, hasta el tope).
      Worker__Retry__MaxAttempts: ${ERPSYNC_JOB_MAX_ATTEMPTS:-12}
      Worker__Retry__BaseDelay: ${ERPSYNC_JOB_RETRY_BASE_DELAY:-00:00:30}
      Worker__Retry__MaxDelay: ${ERPSYNC_JOB_RETRY_MAX_DELAY:-01:00:00}
      # Sin clave, el panel (/admin/*) queda deshabilitado (503); admite varias claves separadas por coma para rotarlas.
      Admin__ApiKey: ${ERPSYNC_ADMIN_API_KEY:-}
    ports:
      - "127.0.0.1:${ERPSYNC_HUB_HOST_PORT:-5200}:8080"
  # --- Tienda WooCommerce (opcional): docker compose --profile tienda up -d ---
  tienda-db:
    image: mysql:8.4
    profiles: [tienda]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${ERPSYNC_WP_DB_PASSWORD:-}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$MYSQL_PASSWORD" ] || { echo "Define ERPSYNC_WP_DB_PASSWORD (ver docs/variables-de-entorno.md)" >&2; exit 1; }
        exec docker-entrypoint.sh mysqld
    volumes:
      - tienda-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  tienda:
    image: wordpress:7-apache
    profiles: [tienda]
    restart: unless-stopped
    depends_on:
      tienda-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: tienda-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${ERPSYNC_WP_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${ERPSYNC_TIENDA_HOST_PORT:-5203}:80"
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$WORDPRESS_DB_PASSWORD" ] || { echo "Define ERPSYNC_WP_DB_PASSWORD (ver docs/variables-de-entorno.md)" >&2; exit 1; }
        exec docker-entrypoint.sh apache2-foreground
    volumes:
      - tienda-files:/var/www/html
      # SOLO DESARROLLO: deja que WordPress entregue webhooks al hub local (ver el archivo).
      - ./docker/tienda/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tienda-setup:
    image: wordpress:cli
    profiles: [tienda]
    user: "33:33"
    depends_on:
      - tienda
    restart: "no"
    environment:
      WORDPRESS_DB_HOST: tienda-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${ERPSYNC_WP_DB_PASSWORD:-}
      WP_URL: http://localhost:${ERPSYNC_TIENDA_HOST_PORT:-5203}
      WP_ADMIN_USER: ${ERPSYNC_WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${ERPSYNC_WP_ADMIN_PASSWORD:-}
      WP_ADMIN_EMAIL: ${ERPSYNC_WP_ADMIN_EMAIL:-admin@example.com}
      WC_WEBHOOK_SECRET: ${ERPSYNC_WC_WEBHOOK_SECRET:-}
      HUB_WEBHOOK_URL: ${ERPSYNC_HUB_WEBHOOK_URL:-http://hub:8080/webhooks/woocommerce/orders}
      # Clave de la API REST que usa el hub; tienda-setup la registra en WooCommerce (docker/tienda/registrar-claves-api.php).
      WC_CONSUMER_KEY: ${ERPSYNC_WC_CONSUMER_KEY:-}
      WC_CONSUMER_SECRET: ${ERPSYNC_WC_CONSUMER_SECRET:-}
    volumes:
      - tienda-files:/var/www/html
      - ./docker/tienda/instalar-woocommerce.sh:/instalar-woocommerce.sh:ro
      - ./docker/tienda/registrar-claves-api.php:/registrar-claves-api.php:ro
      # El mismo mu-plugin que la tienda: wp-cli también entrega webhooks (por ejemplo, al crear un pedido desde la consola).
      - ./docker/tienda/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    entrypoint: ["sh", "/instalar-woocommerce.sh"]

volumes:
  postgres-data:
  seq-data:
  tienda-db-data:
  tienda-files:
