name: erp-sync-hub

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erpsynchub}
      POSTGRES_USER: ${POSTGRES_USER:-erpsynchub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  sap-mock:
    build:
      context: .
      dockerfile: src/SapB1.Mock/Dockerfile
    restart: unless-stopped
    ports:
      - "${SAP_MOCK_PORT:-5100}:8080"

  # --- El hub (perfil opcional): docker compose --profile hub up -d --build ---
  # Necesita en .env, como mínimo, POSTGRES_PASSWORD y WC_WEBHOOK_SECRET (ver .env.example).
  hub:
    build:
      context: .
      dockerfile: src/ErpSyncHub.Api/Dockerfile
    profiles: [hub]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sap-mock:
        condition: service_healthy
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-erpsynchub};Username=${POSTGRES_USER:-erpsynchub};Password=${POSTGRES_PASSWORD:-}
      Database__MigrateOnStartup: "true"
      Webhooks__WooCommerce__Secret: ${WC_WEBHOOK_SECRET:-}
      SAP__BaseUrl: http://sap-mock:8080
      SAP__CompanyDb: ${SAP_COMPANY_DB:-SBODemoCL}
      SAP__UserName: ${SAP_USER_NAME:-manager}
      SAP__Password: ${SAP_PASSWORD:-manager}
    ports:
      - "${HUB_PORT:-5191}:8080"
  # --- Tienda WooCommerce (opcional): docker compose --profile tienda up -d ---
  tienda-db:
    image: mysql:8.4
    profiles: [tienda]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-}
      MYSQL_RANDOM_ROOT_PASSWORD: "1"
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$MYSQL_PASSWORD" ] || { echo "Define WP_DB_PASSWORD en .env (ver .env.example)" >&2; exit 1; }
        exec docker-entrypoint.sh mysqld
    volumes:
      - tienda-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  tienda:
    image: wordpress:7-apache
    profiles: [tienda]
    restart: unless-stopped
    depends_on:
      tienda-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: tienda-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-}
    ports:
      - "${WP_PORT:-8081}:80"
    entrypoint:
      - sh
      - -c
      - |
        [ -n "$$WORDPRESS_DB_PASSWORD" ] || { echo "Define WP_DB_PASSWORD en .env (ver .env.example)" >&2; exit 1; }
        exec docker-entrypoint.sh apache2-foreground
    volumes:
      - tienda-files:/var/www/html
      # SOLO DESARROLLO: deja que WordPress entregue webhooks al hub local (ver el archivo).
      - ./docker/tienda/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tienda-setup:
    image: wordpress:cli
    profiles: [tienda]
    user: "33:33"
    depends_on:
      - tienda
    restart: "no"
    environment:
      WORDPRESS_DB_HOST: tienda-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-}
      WP_URL: http://localhost:${WP_PORT:-8081}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      WC_WEBHOOK_SECRET: ${WC_WEBHOOK_SECRET:-}
      HUB_WEBHOOK_URL: ${HUB_WEBHOOK_URL:-http://hub:8080/webhooks/woocommerce/orders}
    volumes:
      - tienda-files:/var/www/html
      - ./docker/tienda/instalar-woocommerce.sh:/instalar-woocommerce.sh:ro
      # El mismo mu-plugin que la tienda: wp-cli también entrega webhooks (por ejemplo, al crear un pedido desde la consola).
      - ./docker/tienda/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    entrypoint: ["sh", "/instalar-woocommerce.sh"]

volumes:
  postgres-data:
  tienda-db-data:
  tienda-files:
