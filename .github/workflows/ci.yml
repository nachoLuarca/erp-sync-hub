name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, formato y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Verificar formato
        run: dotnet format ErpSyncHub.slnx --verify-no-changes --no-restore

      - name: Tests con cobertura
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Restaurar herramientas
        if: ${{ !cancelled() }}
        run: dotnet tool restore

      - name: Generar reporte de cobertura
        if: ${{ !cancelled() }}
        run: >
          dotnet reportgenerator
          -reports:"coverage/**/coverage.cobertura.xml"
          -classfilters:"-System.*;-Microsoft.*"
          -targetdir:coverage/reporte
          -reporttypes:"MarkdownSummaryGithub;Cobertura;HtmlInline"

      - name: Publicar resumen de cobertura
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/reporte/SummaryGithub.md ]; then
            cat coverage/reporte/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/reporte
          if-no-files-found: warn
          retention-days: 14
