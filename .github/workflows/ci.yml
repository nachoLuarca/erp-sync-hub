name: CI

on:
  push:
    # Un tag v* dispara solo el workflow de release, que llama a este mismo CI: así no corre dos veces.
    tags-ignore:
      - "v*"
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build, formato y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar SDK de .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache de paquetes NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Verificar formato
        run: dotnet format ErpSyncHub.slnx --verify-no-changes --no-restore

      - name: Tests con cobertura
        run: >
          dotnet test -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Restaurar herramientas
        if: ${{ !cancelled() }}
        run: dotnet tool restore

      - name: Generar reporte de cobertura
        if: ${{ !cancelled() }}
        run: >
          dotnet reportgenerator
          -reports:"coverage/**/coverage.cobertura.xml"
          -classfilters:"-System.*;-Microsoft.*"
          -targetdir:coverage/reporte
          -reporttypes:"MarkdownSummaryGithub;Cobertura;HtmlInline"

      - name: Publicar resumen de cobertura
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/reporte/SummaryGithub.md ]; then
            cat coverage/reporte/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: coverage/reporte
          if-no-files-found: warn
          retention-days: 14

      - name: Subir cobertura a Codecov
        # Solo en ramas: un tag de release no aporta una medición nueva. Sin CODECOV_TOKEN (por ejemplo, en un fork) se omite.
        if: ${{ !cancelled() && github.ref_type == 'branch' && env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/reporte/Cobertura.xml
          disable_search: true
          fail_ci_if_error: false
